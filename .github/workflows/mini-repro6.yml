        tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz

        mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin

        popd

        '
    - name: Install build runtime
      run: "brew install llvm create-dmg\n# pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner\nif command -v pkg-config &>/dev/null; then\n    echo \"pkg-config is already installed\"\nelse\n    brew install pkg-config\nfi\n"
    - name: Install NASM
      run: '# Install NASM 2.16.x from official release.

        # Do NOT use `brew install nasm` which installs NASM 3.x.

        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.

        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.

        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip

        unzip nasm-2.16.03-macosx.zip

        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

        nasm --version

        '
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Workaround for flutter issue
      shell: bash
      run: 'cd "$(dirname "$(which flutter)")"

        # https://github.com/flutter/flutter/issues/133533

        sed -i -e ''s/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g'' ../packages/flutter/lib/src/scheduler/binding.dart

        grep -n ''_setFramesEnabledState(false);'' ../packages/flutter/lib/src/scheduler/binding.dart

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.MAC_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Run the Dart tests
      if: ${{ !inputs.upload-artifact && matrix.job.arch == 'aarch64' }}
      working-directory: flutter
      run: flutter test --timeout 60s
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: 'clang --version || true

        rustup -V

        rustup toolchain list

        rustup default

        cargo -V

        rustc -V

        '
    - name: Build rustdesk
      run: "if [ \"${{ matrix.job.target }}\" = \"aarch64-apple-darwin\" ]; then\n  MIN_MACOS_VERSION=\"12.3\"\n  sed -i -e \"s/MACOSX_DEPLOYMENT_TARGET\\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/\" build.py\n  sed -i -e \"s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/\" flutter/macos/Podfile\n  sed -i -e \"s/osx_minimum_system_version = \\\"[0-9]*.[0-9]*\\\"/osx_minimum_system_version = \\\"${MIN_MACOS_VERSION}\\\"/\" Cargo.toml\n  sed -i -e \"s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/\" flutter/macos/Runner.xcodeproj/project.pbxproj\n  echo \"MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}\" >> \"$GITHUB_ENV\"\nfi\n./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}\n"
    - name: Test verified updates
      if: env.PUBLISH_UPDATE_METADATA == 'true'
      run: 'python3 -m unittest res/update/test_macos_update_scripts.py

        cargo test --locked --release --lib platform::macos::update_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"

        cargo test --locked --release --lib verified_dmg_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"

        cargo test --locked --release --lib update_metadata::tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"

        '
    - name: Run the Rust tests
      if: ${{ !inputs.upload-artifact && matrix.job.arch == 'aarch64' }}
      run: '# The build''s own features, so the tests see the code that ships. MACOSX_DEPLOYMENT_TARGET

        # comes from the build step''s export.

        FEATURES=$(./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }} --print-features)

        cargo test --locked --release --lib --features "$FEATURES"

        # Opt-in, and its macOS tests run nowhere else.

        cargo test --locked --release -p clipboard --features unix-file-copy-paste

        '
    - name: create unsigned dmg
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'CREATE_DMG="$(command -v create-dmg)"

        CREATE_DMG="$(readlink -f "$CREATE_DMG")"

        sed -i -e ''s/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/'' "$CREATE_DMG"

        create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

        '
    - name: Upload unsigned macOS app
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-macos-${{ matrix.job.arch }}
        path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
    - name: Codesign app and create signed dmg
      if: env.MACOS_P12_BASE64 != null && env.UPLOAD_ARTIFACT == 'true'
      run: "# Patch create-dmg to give more attempts to unmount image\nCREATE_DMG=\"$(command -v create-dmg)\"\nCREATE_DMG=\"$(readlink -f \"$CREATE_DMG\")\"\nsed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' \"$CREATE_DMG\"\n# Unlock keychain\nsecurity default-keychain -s rustdesk.keychain\nsecurity unlock-keychain -p ${{ secrets.MACOS_P12_PASSWORD }} rustdesk.keychain\n# start sign the rustdesk.app and dmg\nrm -rf *.dmg || true\n# the identity secret carries its own shell quoting, so expand it inline like the dmg codesign below\nbash ./.github/scripts/sign-macos-app.sh \\\n  ./flutter/build/macos/Build/Products/Release/RustDesk.app \\\n  ${{ secrets.MACOS_CODESIGN_IDENTITY }} \\\n  ./flutter/macos/Runner/Release.entitlements\nif [ \"$PUBLISH_UPDATE_METADATA\" = \"true\" ]; then\n  reported_version=\"$(./flutter/build/macos/Build/Products/Release/RustDesk.app/Contents/MacOS/RustDesk --version)\"\n  if [ \"$reported_version\" != \"$VERSION\" ]; then\n    echo \"::error::RustDesk reports version '$reported_version', expected '$VERSION'\"\n    exit 1\n  fi\nfi\ncreate-dmg --icon \"RustDesk.app\" 200 190 --hide-extension \"RustDesk.app\" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app\ncodesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY }} --deep --strict rustdesk-${{ env.VERSION }}.dmg -vvv\n# notarize the rustdesk-${{ env.VERSION }}.dmg\nrcodesign notary-submit --api-key-path ${{ github.workspace }}/rustdesk.json  --staple rustdesk-${{ env.VERSION }}.dmg\n"
    - name: Rename rustdesk
      if: env.UPLOAD_ARTIFACT == 'true'
      shell: bash
      env:
        VERSION: ${{ env.VERSION }}
        ARCH: ${{ matrix.job.arch }}
      run: "if [ -f \"rustdesk-${VERSION}.dmg\" ]; then\n    mv \"rustdesk-${VERSION}.dmg\" \"rustdesk-${VERSION}-${ARCH}.dmg\"\nfi\ntest -f \"rustdesk-${VERSION}-${ARCH}.dmg\"\n"
    - name: Upload signed macOS DMG
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.MACOS_P12_BASE64 != null
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-${{ matrix.job.arch }}-dmg
        path: ./rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
        if-no-files-found: error
    - name: Publish DMG package
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: 'rustdesk*-${{ matrix.job.arch }}.dmg

          '
  publish-signed-update-metadata:
    needs:
    - build-for-windows-flutter
    - build-for-windows-sciter
    - build-for-macOS
    runs-on: ubuntu-22.04
    if: ${{ inputs.upload-artifact && inputs.publish-update-metadata && github.repository == 'rustdesk/rustdesk' }}
    concurrency:
      group: signed-update-${{ inputs.upload-tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - name: Refuse to replace published update metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ env.TAG_NAME }}
      run: "set -euo pipefail\nreleases=\"$(gh api --paginate --slurp \"repos/${GITHUB_REPOSITORY}/releases?per_page=100\")\"\nrelease_id=\"$(\n  jq -r --arg tag \"$TAG_NAME\" '\n    [.[][] | select(.tag_name == $tag)] |\n    if length == 0 then \"\"\n    elif length == 1 then .[0].id\n    else error(\"multiple releases found for tag\")\n    end\n  ' <<<\"$releases\"\n)\"\nif [ -z \"$release_id\" ]; then\n  exit 0\nfi\nassets=\"$(gh api --paginate --slurp \"repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100\")\"\nif jq -e 'any(.[][]; .name == \"rustdesk-update.json\")' <<<\"$assets\" >/dev/null; then\n  echo \"::error::Signed update metadata is already published for ${TAG_NAME}; use a new release tag for corrected artifacts.\"\n  exit 1\nfi\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'
    - name: Download Windows artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: windows-*
        path: ./artifacts/
        merge-multiple: true
    - name: Download macOS artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: macos-*
        path: ./artifacts/
        merge-multiple: true
    - name: Sign update metadata
      env:
        RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
      run: "python res/update/generate_update_metadata.py sign \\\n  --artifact windows x86_64 exe \"./artifacts/rustdesk-${VERSION}-x86_64.exe\" \\\n  --artifact windows x86_64 msi \"./artifacts/rustdesk-${VERSION}-x86_64.msi\" \\\n  --artifact windows aarch64 exe \"./artifacts/rustdesk-${VERSION}-aarch64.exe\" \\\n  --artifact windows aarch64 msi \"./artifacts/rustdesk-${VERSION}-aarch64.msi\" \\\n  --artifact windows x86 exe \"./artifacts/rustdesk-${VERSION}-x86-sciter.exe\" \\\n  --artifact macos aarch64 dmg \"./artifacts/rustdesk-${VERSION}-aarch64.dmg\" \\\n  --artifact macos x86_64 dmg \"./artifacts/rustdesk-${VERSION}-x86_64.dmg\" \\\n  --version \"$VERSION\" --release-id \"$TAG_NAME\" \\\n  --package-id rustdesk \\\n  --release-base-url https://github.com/rustdesk/rustdesk/releases/download \\\n  --published-at \"$(git log -1 --format=%cI)\" \\\n  --metadata-out ./rustdesk-update.json \\\n  --signature-out ./rustdesk-update.json.sig\n"
    - name: Verify update metadata
      env:
        RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
      run: "python res/update/generate_update_metadata.py verify \\\n  --metadata ./rustdesk-update.json \\\n  --signature ./rustdesk-update.json.sig \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-x86_64.exe\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-x86_64.msi\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-aarch64.exe\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-aarch64.msi\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-x86-sciter.exe\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-aarch64.dmg\" \\\n  --artifact \"./artifacts/rustdesk-${VERSION}-x86_64.dmg\" \\\n  --version \"$VERSION\" --release-id \"$TAG_NAME\" \\\n  --package-id rustdesk \\\n  --release-base-url https://github.com/rustdesk/rustdesk/releases/download\n"
    - name: Upload signed update artifacts
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        prerelease: true
        fail_on_unmatched_files: true
        tag_name: ${{ env.TAG_NAME }}
        files: './artifacts/rustdesk-${{ env.VERSION }}-x86_64.exe

          ./artifacts/rustdesk-${{ env.VERSION }}-x86_64.msi

          ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.exe

          ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.msi

          ./artifacts/rustdesk-${{ env.VERSION }}-x86-sciter.exe

          ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.dmg

          ./artifacts/rustdesk-${{ env.VERSION }}-x86_64.dmg

          '
    - name: Upload signed update metadata signature
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        prerelease: true
