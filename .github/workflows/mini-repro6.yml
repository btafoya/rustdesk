        '
    - name: Install flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      shell: bash
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Patch sources for Flutter 3.44 web
      shell: bash
      run: "if [[ \"${{ env.FLUTTER_VERSION }}\" == 3.44.* ]]; then\n  bash .github/patches/apply_flutter_3.44_web_patches.sh\nfi\n"
    - name: Build web
      shell: bash
      run: 'pushd flutter/web/js

        npm install yarn -g

        npm install typescript -g

        npm install protoc -g

        # Install protoc first, see: https://google.github.io/proto-lens/installing-protoc.html

        npm install ts-proto

        # Only works with vite <= 2.8, see: https://github.com/vitejs/vite/blob/main/docs/guide/build.md#chunking-strategy

        npm install vite@2.8

        yarn install && yarn build

        popd


        pushd flutter/web

        wget https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz

        tar xzf web_deps.tar.gz

        popd


        pushd flutter

        flutter build web --release

        cd build

        cp ../web/README.md web

        # TODO: Remove the following line when the web is almost complete.

        echo -e "\n\nThis build is for preview and not full functionality." >> web/README.md

        dir_name="rustdesk-${{ env.VERSION }}-${{ env.RELEASE_NAME }}"

        mv web "${dir_name}" && tar czf "${dir_name}".tar.gz "${dir_name}"

        sha256sum "${dir_name}".tar.gz

        popd

        '
    - name: Publish web
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: 'flutter/build/rustdesk-${{ env.VERSION }}-${{ env.RELEASE_NAME }}.tar.gz

          '
