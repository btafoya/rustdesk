      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          arch: x86_64
        - target: aarch64-unknown-linux-gnu
          arch: aarch64
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
