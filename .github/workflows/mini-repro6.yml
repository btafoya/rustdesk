name: Build the flutter version of the RustDesk
true:
  workflow_call: null
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: nightly
      publish-update-metadata:
        type: boolean
        default: false
env: {}
jobs:
  validate-update-metadata-keys:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Checkout source code
      if: ${{ inputs.publish-update-metadata }}
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Install Python
      if: ${{ inputs.publish-update-metadata }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      if: ${{ inputs.publish-update-metadata }}
      run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'
    - name: Test update metadata signer
      if: ${{ inputs.publish-update-metadata }}
      run: "python -m unittest \\\n  res/update/test_generate_update_metadata.py \\\n  res/update/test_update_metadata_cli.py \\\n  res/update/test_macos_update_scripts.py\n"
    - name: Validate update metadata keys
      if: ${{ inputs.publish-update-metadata }}
      env:
        RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
        RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
      run: python res/update/generate_update_metadata.py check-key
  generate-sbom:
    needs:
    - validate-update-metadata-keys
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install Syft
      uses: anchore/sbom-action/download-syft@v0
    - name: Generate SBOM
      run: "syft dir:. \\\n  -o cyclonedx-json=rustdesk.sbom.json\n"
    - name: Publish Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      if: env.UPLOAD_ARTIFACT == 'true'
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: 'rustdesk.sbom.json

          '
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
        - target: aarch64-pc-windows-msvc
          os: windows-11-arm
          arch: aarch64
          flutter-arch: arm64
          vcpkg-triplet: arm64-windows-static
          build-args: ''
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Force arm64 Dart SDK + engine
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: "$flutterRoot = \"${{ steps.flutter.outputs['CACHE-PATH'] }}\"\nWrite-Host \"PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE\"\nWrite-Host \"Flutter root: $flutterRoot\"\nRemove-Item -Force \"$flutterRoot\\bin\\cache\\engine-dart-sdk.stamp\" -ErrorAction SilentlyContinue\n& \"$flutterRoot\\bin\\internal\\update_dart_sdk.ps1\"\n# Confirm the Dart we ended up with is arm64 (\"on windows_arm64\"); fail loudly if not.\n$dartVer = & \"$flutterRoot\\bin\\dart.bat\" --version 2>&1 | Out-String\nWrite-Host $dartVer\nif ($dartVer -notmatch \"windows_arm64\") {\n  Write-Error \"Expected an arm64 Dart SDK but got: $dartVer\"\n  exit 1\n}\n& \"$flutterRoot\\bin\\flutter.bat\" precache --windows\n# Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should\n# fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.\n$engineDir = \"$flutterRoot\\bin\\cache\\artifacts\\engine\"\nWrite-Host \"Engine artifacts present:\"\nGet-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host\nif (-not (Test-Path \"$engineDir\\windows-arm64-release\")) {\n  Write-Error \"Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK).\"\n  exit 1\n}\n"
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: "cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))\ncd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.FLUTTER_VERSION}} ]]; then\n  git apply flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: Set SODIUM_LIB_DIR (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"
    - name: Build rustdesk
      run: "# Windows: build RustDesk\n# --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix\npython3 .\\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}\nmv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk\n\n# Download usbmmidd_v2.zip and extract it to ./rustdesk\nInvoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip\nExpand-Archive usbmmidd_v2.zip -DestinationPath .\nRemove-Item -Path usbmmidd_v2\\Win32 -Recurse\nRemove-Item -Path \"usbmmidd_v2\\deviceinstaller64.exe\", \"usbmmidd_v2\\deviceinstaller.exe\", \"usbmmidd_v2\\usbmmidd.bat\"\nmv -Force .\\usbmmidd_v2 ./rustdesk\n\n# Download printer driver files and extract them to ./rustdesk\ntry {\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums\n\n  # Check and move the files\n  $checksum_driver = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*rustdesk_printer_driver_v4-1.4\\.zip$').Matches.Groups[1].Value\n  $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256\n  $checksum_adapter = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*printer_driver_adapter\\.zip$').Matches.Groups[1].Value\n  $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256\n  if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums match, extract the file.\"\n      Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .\n      mkdir ./rustdesk/drivers\n      mv -Force .\\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver\n      Expand-Archive printer_driver_adapter.zip -DestinationPath .\n      mv -Force .\\printer_driver_adapter.dll ./rustdesk\n  } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file.\"\n  } else {\n      Write-Output \"printer_driver_adapter.dll, checksums do not match, ignore the file.\"\n  }\n} catch {\n    Write-Host \"Ingore the printer driver error.\"\n}\n"
    - name: Run the Rust tests
      if: ${{ !inputs.upload-artifact && matrix.job.arch == 'x86_64' }}
      shell: bash
      run: '# The build''s own features, so the tests see the code that ships.

        FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }} --print-features)

        cargo test --locked --release --lib --features "$FEATURES"

        # Its Windows tests run nowhere else.

        cargo test --locked --release -p clipboard

        '
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res: $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\nfi\n"
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: ${{ inputs.upload-artifact }}
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: rustdesk
    - name: Sign rustdesk files
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'pip3 install requests argparse

        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

        '
    - name: Verify Windows Flutter version
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true'
      shell: powershell
      run: "$reportedVersion = (& \".\\rustdesk\\rustdesk.exe\" --version | Out-String).Trim()\nif ($LASTEXITCODE -ne 0) {\n  throw \"rustdesk --version exited with $LASTEXITCODE\"\n}\nif ($reportedVersion -cne $env:VERSION) {\n  throw \"RustDesk reports version '$reportedVersion', expected '$env:VERSION'\"\n}\n"
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

        '
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      with:
        msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}
    - name: Build msi
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'pushd ./res/msi

        python preprocess.py --arp -d ../../rustdesk

        nuget restore msi.sln

        $msiPlatform = if (''${{ matrix.job.arch }}'' -eq ''aarch64'') { ''ARM64'' } else { ''x64'' }

        msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10

        $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1

        mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi

        sha256sum ../../SignOutput/rustdesk-*.msi

        '
    - name: Build pre-built MSI template
      if: env.UPLOAD_ARTIFACT == 'true'
      run: "git checkout -- res/msi\ncp -r ./rustdesk ./rustdesk-msi-template\nmv ./rustdesk-msi-template/rustdesk.exe ./rustdesk-msi-template/RDAPPNAM.exe\nSet-Content -Path ./rustdesk-msi-template/custom.txt -Value 'placeholder' -NoNewline\n$assets = './rustdesk-msi-template/data/flutter_assets/assets'\nNew-Item -ItemType Directory -Force -Path $assets | Out-Null\nforeach ($a in 'icon.ico','icon.png','logo.png','logo_light.png','logo_dark.png') {\n  Set-Content -Path \"$assets/$a\" -Value 'placeholder' -NoNewline\n}\npushd ./res/msi\npython preprocess.py --arp --template --revision-version 0 -d ../../rustdesk-msi-template --app-name RDAPPNAM\n$msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }\nmsbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=$msiPlatform\nmsbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10\n$msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1\npopd\nmkdir ./msi-template\nmv $msi.FullName ./msi-template/rustdesk-template-${{ matrix.job.arch }}.msi\ngit checkout -- res/msi\nrm -r -fo ./rustdesk-msi-template\n"
    - name: Upload unsigned msi template
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-msi-template-${{ matrix.job.arch }}
        path: ./msi-template
    - name: Sign rustdesk self-extracted file
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

        '
    - name: Upload signed Windows Flutter EXE
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-flutter-${{ matrix.job.arch }}-exe
        path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
        if-no-files-found: error
    - name: Upload signed Windows Flutter MSI
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-flutter-${{ matrix.job.arch }}-msi
        path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
        if-no-files-found: error
    - name: Publish Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: './SignOutput/rustdesk-*.msi

          ./SignOutput/rustdesk-*.exe

          '
  build-for-windows-sciter:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs:
    - validate-update-metadata-keys
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: i686-pc-windows-msvc
          os: windows-2022
          arch: x86
          vcpkg-triplet: x86-windows-static
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install LLVM and Clang
      uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install Rust toolchain
      shell: bash
      run: "# Sciter's abi_thiscall feature requires nightly Rust.\n# Use an i686 host toolchain so build scripts can load the 32-bit LLVM installed above.\n# Since rustup 1.29.1, i686 toolchains on x64 Windows require --force-non-host\n# for both installation and default selection, even though WOW64 can run them.\n# See https://github.com/rust-lang/rustup/pull/4935.\n# Alternatively, an x64 compiler could use cargo build --target i686-pc-windows-msvc.\n# This requires 64-bit LLVM for host build scripts and updated packaging paths,\n# and has not been manually verified for RustDesk.\nrustup toolchain install nightly-2023-10-13-${{ matrix.job.target }} \\\n  --target ${{ matrix.job.target }} --component rustfmt \\\n  --profile minimal --no-self-update --force-non-host\nrustup default nightly-2023-10-13-${{ matrix.job.target }} --force-non-host\n"
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}-sciter
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: Build rustdesk
      id: build
      shell: bash
      run: 'python3 res/inline-sciter.py

        # Patch sciter x86

        sed -i ''s/branch = "dyn"/branch = "dyn_x86"/g'' ./Cargo.toml

        cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e

        cargo build --locked --features inline,vram,hwcodec --release --bins

        mkdir -p ./Release

        mv ./target/release/rustdesk.exe ./Release/rustdesk.exe

        curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll

        echo "output_folder=./Release" >> $GITHUB_OUTPUT

        curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip

        unzip usbmmidd_v2.zip

        # Do not remove x64 files, because the user may run the 32bit version on a 64bit system.

        # Do not remove ./usbmmidd_v2/deviceinstaller64.exe, as x86 exe cannot install and uninstall drivers when running on x64,

        # we need the x64 exe to install and uninstall the driver.

        rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat

        mv ./usbmmidd_v2 ./Release || true

        '
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res: $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\nfi\n"
    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: Release
    - name: Sign rustdesk files
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'pip3 install requests argparse

        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./Release/

        '
