        - target: aarch64-unknown-linux-gnu
          distro: ubuntu22.04
          true: ubuntu-22.04-arm
          arch: aarch64
          suffix: ''
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Download Binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.deb
        path: .
    - name: Rename Binary
      run: 'mv rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.deb flatpak/rustdesk.deb

        '
    - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
      name: Build rustdesk flatpak package for ${{ matrix.job.arch }}
      id: flatpak
      with:
