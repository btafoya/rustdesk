  build-rustdesk-android:
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: "cd $(dirname $(dirname $(which flutter)))\nif [[ \"3.24.5\" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\nfi\n"
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ANDROID_TARGET=arm64-v8a\n  ;;\n  armv7-linux-androideabi)\n    ANDROID_TARGET=armeabi-v7a\n  ;;\n  x86_64-linux-android)\n    ANDROID_TARGET=x86_64\n  ;;\n  i686-linux-android)\n    ANDROID_TARGET=x86\n  ;;\nesac\nif ! ./flutter/build_android_deps.sh \"${ANDROID_TARGET}\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\n"
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: ${{ matrix.job.target }}
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "rustup target add ${{ matrix.job.target }}\ncargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ./flutter/ndk_arm64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n  ;;\n  armv7-linux-androideabi)\n    ./flutter/ndk_arm.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n  ;;\n  x86_64-linux-android)\n    ./flutter/ndk_x64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n  ;;\n  i686-linux-android)\n    ./flutter/ndk_x86.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  ;;\nesac\n"
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\" ./flutter/android/gradle.properties\n# temporary use debug sign config\nsed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  armv7-linux-androideabi)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm --split-per-abi\n    mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  x86_64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  i686-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x86 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\nesac\npopd\nmkdir -p signed-apk; pushd signed-apk\nmv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .\n"
    - name: Setup sign tool version variable
      shell: bash
      run: 'BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)

        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

        echo Last build tool version is: $BUILD_TOOL_VERSION

        '
    - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
      name: Sign app APK
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
